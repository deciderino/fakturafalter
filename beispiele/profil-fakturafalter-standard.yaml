version: 2
beschreibung: 'Eingebautes Standardformat (DE: UTF-8 mit BOM, Semikolon, Dezimalkomma,
  TT.MM.JJJJ). Greift nur, wenn die Kopfzeile die 9 Pflichtnamen trägt und kein früheres
  aktives Profil passt.'

# CSV-Zuordnungsprofil für den Proof of Concept – passt zu TM-2026-0042.csv (ALLE Daten erfunden)
#
# Besonderheit gegenüber profil-variante-a/b/c:
#   - Die Käuferdaten (Name, Anschrift, USt-IdNr., E-Mail, Leitweg-ID) stehen direkt in der CSV.
#     Ein getrennter Kundenstamm ist nicht vorgesehen; der Käufer steht in der CSV.
#   - Verkäufer, Bankverbindung und Zahlungsbedingungen stehen fest in diesem Profil
#     (Blöcke „verkaeufer“, „zahlung“, „bemerkungen“). Sie haben Vorrang vor der Konfiguration.
#   - Das Ausgabeformat ist fest ZUGFeRD, Profil EN 16931.
profil: poc-tischlerei
version: 2
beschreibung: "PoC: WaWi-Export Tischlerei, eine Zeile je Position, UTF-8, Semikolon, Dezimalkomma"

datei:
  muster: "*.csv"
  kodierung: auto            # auto erkennt UTF-8 (mit/ohne BOM) und Windows-1252
  trennzeichen: ";"
  textbegrenzer: '"'         # Werte mit ; darin in "…" setzen
  kopfzeile: true            # erste Zeile = Spaltennamen (Reihenfolge der Spalten egal)

zahlen:  {dezimal: ",", tausender: "."}   # 1.850,00
datum:   {format: "%d.%m.%Y"}             # 28.10.2026

aufbau:
  art: zeile_je_position     # jede Zeile = eine Position, Kopfdaten in jeder Zeile wiederholt
  rechnung_schluessel: rechnungsnummer    # Zeilen mit gleicher Nummer = eine Rechnung
  kopf_muss_gleich_sein: [rechnungsdatum, kundennummer, kunde_name]

felder:
  kopf:
    # --- Rechnung ---
    BT-1:          {spalte: rechnungsnummer}                       # Pflicht
    BT-2:          {spalte: rechnungsdatum, typ: datum}            # Pflicht
    BT-72:         {spalte: leistungsdatum, typ: datum, optional: true}   # § 14 UStG – fehlt es, gibt es eine Warnung
    BT-13:         {spalte: bestellnummer, optional: true}
    kundennummer:  {spalte: kundennummer}                          # Pflicht, wird Käuferkennung BT-46
    BT-3:          {fest: "380"}                                   # 380 = Rechnung
    BT-5:          {fest: EUR}
    # --- Käufer (aus der CSV) ---
    BT-44:         {spalte: kunde_name}                            # Pflicht
    BT-50:         {spalte: kunde_strasse, optional: true}
    BT-53:         {spalte: kunde_plz, optional: true}             # als Text lesen, damit 01234 bleibt
    BT-52:         {spalte: kunde_ort, optional: true}
    BT-55:         {spalte: kunde_land, optional: true}            # ISO-Code, leer = DE
    BT-48:         {spalte: kunde_ustid, optional: true}
    BT-49:         {spalte: kunde_email, optional: true}           # elektronische Adresse des Käufers
    BT-10:         {spalte: leitweg_id, optional: true}            # nur Behörden; leer = kein BT-10
  position:
    BT-126:        {spalte: pos}
    BT-155:        {spalte: artikelnummer, optional: true}
    BT-153:        {spalte: bezeichnung}
    BT-129:        {spalte: menge, typ: zahl}
    BT-130:        {spalte: einheit, mapping: einheiten}
    BT-146:        {spalte: einzelpreis_netto, typ: zahl}
    steuer:        {spalte: steuerschluessel, mapping: steuer}

mappings:
  einheiten:                 # Einheit in der WaWi -> UN/ECE Rec 20
    "Stk": C62
    "Stück": C62
    "Std": HUR
    "m": MTR
    "m²": MTK
    "psch": LS
    unbekannt: pruefen       # pruefen | fehler | fester Code, z.B. C62
  steuer:                    # Steuerschlüssel der WaWi -> BT-151 / BT-152
    "1": {BT-151: S, BT-152: 19}
    "2": {BT-151: S, BT-152: 7}
    unbekannt: pruefen

# --- Feste Werte des Verkäufers (Vorrang vor „absender“ in der Konfiguration) ---
verkaeufer:
  name: Tischlerei Muster GmbH                             # BT-27
  anschrift: {strasse: Hobelweg 7, plz: "12345", ort: Musterstadt, land: DE}
  ust_id: DE123456788                                      # BT-31 (erfunden)
  steuernummer: ""                                         # BT-32, optional
  elektronische_adresse: rechnung@tischlerei-muster.example   # BT-34
  kontakt: {name: Erika Beispiel, telefon: "+49 000 0000000", email: buchhaltung@tischlerei-muster.example}
  register: Amtsgericht Musterstadt HRB 00000              # BT-30

zahlung:
  art: "58"                                  # 58 = SEPA-Überweisung
  iban: DE36 0000 0000 0000 0000 00          # erfunden, nur die Prüfziffer stimmt
  bic: ""
  kontoinhaber: Tischlerei Muster GmbH
  bedingungen: "Zahlbar innerhalb {zahlungsziel_tage} Tagen ohne Abzug."
  ziel_tage: 14                              # Fälligkeit = Rechnungsdatum + 14 Tage

bemerkungen:
  - {text: "Tischlerei Muster GmbH · Geschäftsführung: Max Beispiel · Amtsgericht Musterstadt HRB 00000", code: REG}

ausgabe:
  format: ZUGFERD_EN16931    # fest; sonst XRECHNUNG_CII

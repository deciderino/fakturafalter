profil: beispiel-bloecke-klassisch
version: 1
beschreibung: 'Beispiel A: Kopf, Positionen, Zahlung, ohne Marker (fiktiv).'
datei:
  muster: beispiel-bloecke-*.csv
  kodierung: utf-8-sig
  trennzeichen: ;
  textbegrenzer: '"'
  kopfzeile: false
zahlen:
  dezimal: ','
  tausender: .
datum:
  format: '%d.%m.%Y'
aufbau:
  art: bloecke
  kopfzeile_schwelle: 2
  textzeile:
    leer:
    - BT-129
    - BT-146
    - text
    text_spalte: Artikel
    ziel: BT-154
    trenner: '

      '
    platzhalter: '#LEER'
    verwaist: BT-22
    leerzeile_modus: beides
    zwischen: vorher
    preis_ohne_menge: pruefen
bloecke:
- typ: kopf
  wiederholend: false
  kopfzeile:
  - Rechnungsnr
  - Datum
  - Leistungsdatum
  - Kundennummer
  - Kunde
  - Strasse
  - PLZ
  - Ort
  felder:
    BT-1:
      spalte: Rechnungsnr
    BT-2:
      spalte: Datum
      typ: datum
      optional: true
    BT-72:
      spalte: Leistungsdatum
      typ: datum
      optional: true
    kundennummer:
      spalte: Kundennummer
      optional: true
    BT-44:
      spalte: Kunde
      optional: true
    BT-50:
      spalte: Strasse
      optional: true
    BT-53:
      spalte: PLZ
      optional: true
    BT-52:
      spalte: Ort
      optional: true
    BT-3:
      fest: '380'
    BT-5:
      fest: EUR
- typ: positionen
  wiederholend: true
  kopfzeile:
  - Rechnungsnr
  - Artikel
  - Menge
  - Einheit
  - Einzelpreis
  - USt-Satz
  felder:
    BT-1:
      spalte: Rechnungsnr
      optional: true
    BT-153:
      spalte: Artikel
      optional: true
    BT-129:
      spalte: Menge
      typ: zahl
      optional: true
    BT-130:
      spalte: Einheit
      optional: true
      mapping: einheiten
    BT-146:
      spalte: Einzelpreis
      typ: zahl
      optional: true
    steuer:
      spalte: USt-Satz
      optional: true
      mapping: steuer
- typ: zahlung
  wiederholend: false
  kopfzeile:
  - Skonto
  - Zahlungsziel mit Skonto
  - Zahlungsziel ohne Abzug
  - Gesamt Netto
  - Gesamt Brutto
  felder:
    skonto_satz:
      spalte: Skonto
      typ: prozent
      optional: true
    skonto_tage:
      spalte: Zahlungsziel mit Skonto
      typ: tage
      optional: true
    zahlungsziel_tage:
      spalte: Zahlungsziel ohne Abzug
      typ: tage
      optional: true
    BT-109:
      spalte: Gesamt Netto
      typ: zahl
      optional: true
      zweck: pruefung
    BT-112:
      spalte: Gesamt Brutto
      typ: zahl
      optional: true
      zweck: pruefung
mappings:
  einheiten:
    Stück: H87
    Stk: H87
    Stunde: HUR
    pauschal: LS
    unbekannt: pruefen
  steuer:
    unbekannt: satz
